[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single package, single virtualenv — not a monorepo. See ADR 0005.
[project]
name = "sarna-designer"
version = "0.1.0.dev0"
description = "Design and rank promoter-targeting small activating RNA (saRNA) duplexes"
requires-python = "==3.11.*"
license = { file = "LICENSE" }
authors = [{ name = "Joep Vondervoort" }]
# The engine core deliberately depends on nothing heavier than pydantic, so the design rules
# and regression suite run with no network, no bigWigs and no web framework present (ADR 0005).
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
# Genomics/epigenomics adapters. Separated so the engine stays installable without them.
genomics = [
    "httpx>=0.27,<1",     # Ensembl REST client
    "pyBigWig>=0.3.22",   # AF22 histone track reader
    "numpy>=1.26,<3",     # required by pyBigWig at import time; not declared by it
    "pyliftover>=0.4",    # GRCh38 -> GRCh37 query conversion at the bigWig adapter (ADR 0004)
]
api = ["fastapi>=0.111,<1", "uvicorn[standard]>=0.30,<1"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sarna"]
# Reference datasets are part of the library, not test scaffolding: the validation harness
# must find them in an installed wheel, not only in a source checkout.
artifacts = [
    "src/sarna/validation/data/*.csv",
    "src/sarna/regulatory/data/*.json",
    "src/sarna/view/*.html",
    "src/sarna/genome/data/*.toml",
    "src/sarna/regulatory/data/*.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# legacy/ is a preserved historical record (ADR 0001). Never lint or reformat it.
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; full docstring coverage there is noise.
"tests/**" = ["D100", "D101", "D102", "D103", "ANN201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["^legacy/"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Neither ships type stubs.
module = ["pyBigWig.*", "pyliftover.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ADR 0005 commits the *engine* to strict typing. Requiring `-> None` on every test function
# adds no safety, so that one rule is relaxed here; everything else stays strict in tests too.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Strand/coordinate correctness is the highest-risk area in this project; mark those tests so
# they can be run as a fast pre-commit gate.
markers = [
    "strand: plus/minus strand and coordinate-conversion correctness",
    "regression: pins legacy-scanner preset output against legacy/sarna_promoter_scanner.py",
    "network: requires live external APIs; excluded from the default run",
    "tracks: needs the 890 MB AF22 histone bigWigs; skips cleanly when absent",
]
addopts = "-m 'not network'"

[tool.coverage.run]
source = ["src/sarna"]
branch = true
