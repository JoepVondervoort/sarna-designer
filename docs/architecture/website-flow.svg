    <polyline points="400,1075 460,1075" fill="none" stroke="#748b87" stroke-width="1.7" marker-end="url(#arrow)" />
    <rect x="412" y="1055" width="36" height="14" fill="#f6f9f7" />
    <text x="430" y="1065" fill="#617974" font-size="11" text-anchor="middle">cited</text>
    <polyline points="630,1010 630,1065 1030,1065 1030,1120" fill="none" stroke="#748b87" stroke-width="1.7" marker-end="url(#arrow)" />
    <text x="60" y="70" fill="#183932" font-size="24" font-weight="600">Local workbench: design deliberately across promoter references</text>
    <text x="60" y="115" fill="#183932" font-size="14" font-weight="400">Browser controls → separate Python runs → saved local comparison → opt-in off-target screen → order-ready duplexes</text>
    <rect x="60" y="160" width="340" height="120" rx="10" fill="#ffffff" stroke="#bdd7cc" stroke-width="1.5" />
    <text x="78" y="205" fill="#183932" font-size="14" font-weight="600">Choose input</text>
    <text x="78" y="225" fill="#617974" font-size="12" font-weight="400">Human gene symbol or Ensembl gene ID</text>
    <text x="78" y="245" fill="#617974" font-size="12" font-weight="400">or your promoter DNA / one FASTA</text>
    <rect x="460" y="160" width="340" height="120" rx="10" fill="#ffffff" stroke="#bdd7cc" stroke-width="1.5" />
    <text x="478" y="205" fill="#183932" font-size="14" font-weight="600">Confirm the gene</text>
    <text x="478" y="225" fill="#617974" font-size="12" font-weight="400">Ensembl GRCh38 · cached or online</text>
    <text x="478" y="245" fill="#617974" font-size="12" font-weight="400">Gene contig, strand and transcripts</text>
    <rect x="860" y="160" width="340" height="120" rx="10" fill="#ffffff" stroke="#bdd7cc" stroke-width="1.5" />
    <text x="878" y="205" fill="#183932" font-size="14" font-weight="600">Whole-gene reference overview</text>
    <text x="878" y="225" fill="#617974" font-size="12" font-weight="400">Exact shared TSSs retain transcript IDs</text>
    <text x="878" y="245" fill="#617974" font-size="12" font-weight="400">Literature anchors keep source / caveats</text>
    <rect x="60" y="370" width="340" height="120" rx="10" fill="#ffffff" stroke="#bdd7cc" stroke-width="1.5" />
    <text x="78" y="415" fill="#183932" font-size="14" font-weight="600">Explain and adjust supported criteria</text>
    <text x="78" y="435" fill="#617974" font-size="12" font-weight="400">Wang defaults · alternatives · citations</text>
    <text x="78" y="455" fill="#617974" font-size="12" font-weight="400">Gate / preference / off · equal points</text>
    <rect x="460" y="370" width="340" height="120" rx="10" fill="#ffffff" stroke="#bdd7cc" stroke-width="1.5" />
    <text x="478" y="415" fill="#183932" font-size="14" font-weight="600">Select one or several references</text>
    <text x="478" y="435" fill="#617974" font-size="12" font-weight="400">Shared or pinned criteria per reference</text>
    <text x="478" y="455" fill="#617974" font-size="12" font-weight="400">Own upstream / downstream retrieval span</text>
    <rect x="860" y="370" width="340" height="120" rx="10" fill="#ffffff" stroke="#bdd7cc" stroke-width="1.5" />
    <text x="878" y="405" fill="#183932" font-size="14" font-weight="600">Add your genomic reference</text>
    <text x="878" y="425" fill="#617974" font-size="12" font-weight="400">GRCh38 +1 base entered 1-based</text>
    <text x="878" y="445" fill="#617974" font-size="12" font-weight="400">Source, name and uncertainty recorded</text>
    <text x="878" y="465" fill="#617974" font-size="12" font-weight="400">Researcher-supplied / inferred</text>
    <rect x="460" y="580" width="340" height="120" rx="10" fill="#ffffff" stroke="#bdd7cc" stroke-width="1.5" />
    <text x="478" y="615" fill="#183932" font-size="14" font-weight="600">Run Python separately per reference</text>
    <text x="478" y="635" fill="#617974" font-size="12" font-weight="400">Generate, evaluate, gate and rank</text>
    <text x="478" y="655" fill="#617974" font-size="12" font-weight="400">Named guide models · explained ratings</text>
    <text x="478" y="675" fill="#617974" font-size="12" font-weight="400">One ranked context per reference</text>
    <rect x="860" y="580" width="340" height="120" rx="10" fill="#ffffff" stroke="#bdd7cc" stroke-width="1.5" />
    <text x="878" y="615" fill="#183932" font-size="14" font-weight="600">Optional evidence context</text>
    <text x="878" y="635" fill="#617974" font-size="12" font-weight="400">Regulatory build · motif predictions</text>
    <text x="878" y="655" fill="#617974" font-size="12" font-weight="400">AF22 local tracks · missing data explicit</text>
    <text x="878" y="675" fill="#617974" font-size="12" font-weight="400">No expression / activity inference</text>
    <rect x="60" y="790" width="340" height="120" rx="10" fill="#ffffff" stroke="#bdd7cc" stroke-width="1.5" />
    <text x="78" y="825" fill="#183932" font-size="14" font-weight="600">Edit and rerun</text>
    <text x="78" y="845" fill="#617974" font-size="12" font-weight="400">Inspect reference and configuration first</text>
    <text x="78" y="865" fill="#617974" font-size="12" font-weight="400">Same-reference admission / rank diff</text>
    <text x="78" y="885" fill="#617974" font-size="12" font-weight="400">Earlier records remain saved</text>
    <rect x="460" y="790" width="340" height="120" rx="10" fill="#ffffff" stroke="#bdd7cc" stroke-width="1.5" />
    <text x="478" y="825" fill="#183932" font-size="14" font-weight="600">Inspect the promoter comparison</text>
    <text x="478" y="845" fill="#617974" font-size="12" font-weight="400">Progress / failures per reference</text>
    <text x="478" y="865" fill="#617974" font-size="12" font-weight="400">Open each map, RNA cores and verdicts</text>
    <text x="478" y="885" fill="#617974" font-size="12" font-weight="400">Separate ranks · no pooled best score</text>
    <rect x="860" y="790" width="340" height="120" rx="10" fill="#ffffff" stroke="#bdd7cc" stroke-width="1.5" />
    <text x="878" y="825" fill="#183932" font-size="14" font-weight="600">Save / reopen locally</text>
    <text x="878" y="845" fill="#617974" font-size="12" font-weight="400">SQLite group links complete child runs</text>
    <text x="878" y="865" fill="#617974" font-size="12" font-weight="400">Reopen without recomputing</text>
    <text x="878" y="885" fill="#617974" font-size="12" font-weight="400">Successes survive another child failure</text>
    <rect x="860" y="1000" width="340" height="120" rx="10" fill="#ffffff" stroke="#bdd7cc" stroke-width="1.5" />
    <text x="878" y="1035" fill="#183932" font-size="14" font-weight="600">Export a frozen research record</text>
    <text x="878" y="1055" fill="#617974" font-size="12" font-weight="400">Excel workbook: every candidate, run, rules</text>
    <text x="878" y="1075" fill="#617974" font-size="12" font-weight="400">Order CSV of 21-mers · core CSV · JSON</text>
    <text x="878" y="1095" fill="#617974" font-size="12" font-weight="400">Offline HTML, self-contained</text>
    <rect x="60" y="1010" width="340" height="130" rx="10" fill="#fdf3ea" stroke="#d8ab7a" stroke-width="1.5" />
    <text x="78" y="1050" fill="#6f4a1d" font-size="14" font-weight="600">Screen for off-targets (opt-in)</text>
    <text x="78" y="1070" fill="#617974" font-size="12" font-weight="400">Press a button; both scopes run at once</text>
    <text x="78" y="1090" fill="#617974" font-size="12" font-weight="400">19-mers leave the machine only here</text>
    <text x="78" y="1110" fill="#617974" font-size="12" font-weight="400">Its own dated record; filters nothing</text>
    <rect x="60" y="1180" width="340" height="120" rx="10" fill="#fdf3ea" stroke="#d8ab7a" stroke-width="1.5" />
    <text x="78" y="1215" fill="#6f4a1d" font-size="14" font-weight="600">NCBI BLAST</text>
    <text x="78" y="1235" fill="#617974" font-size="12" font-weight="400">blastn-short, human only (txid9606)</text>
    <text x="78" y="1255" fill="#617974" font-size="12" font-weight="400">One job per run, polled at NCBI's own pace</text>
    <text x="78" y="1275" fill="#617974" font-size="12" font-weight="400">Minutes, not seconds</text>
    <rect x="460" y="1010" width="340" height="130" rx="10" fill="#ffffff" stroke="#bdd7cc" stroke-width="1.5" />
    <text x="478" y="1050" fill="#183932" font-size="14" font-weight="600">Order-ready duplex</text>
    <text x="478" y="1070" fill="#617974" font-size="12" font-weight="400">19 nt RNA core + 3' dTdT = two 21-mers</text>
    <text x="478" y="1090" fill="#617974" font-size="12" font-weight="400">Guide and passenger named, with the reason</text>
    <text x="478" y="1110" fill="#617974" font-size="12" font-weight="400">Sanity report travels in the row</text>
    <text x="60" y="1419" fill="#617974" font-size="13" font-weight="400">Annotated start sites and researcher references do not establish promoter activity. Ratings count criteria, not activation probability. A screening finds sequence</text>
    <text x="60" y="1439" fill="#617974" font-size="11" font-weight="400">similarity, which is not measured binding, and never removes a candidate.</text>
  </g>
