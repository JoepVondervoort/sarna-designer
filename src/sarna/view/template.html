<meta charset="utf-8">
<title>__VIEW_TITLE__</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
/* Layout: a full-width track browser over a two-column list/detail split, stacking on phones. */
:root {
  --paper: #f3f4f1;
  --panel: #ffffff;
  --ink: #16191c;
  --ink-soft: #5b6268;
  --rule: #d3d7d1;
  --accent: #0f6e76;
  --accent-soft: #d6e9ea;
  --pass: #2a7a4b;
  --warn: #9a6512;
  --fail: #a33a30;
  --na: #76808a;
  --band: #e6e9e3;
  --band-strong: #dbe2d7;
  --font-ui: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-display: "IBM Plex Serif", Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15181b;
    --panel: #1d2125;
    --ink: #e8eaec;
    --ink-soft: #9aa3ab;
    --rule: #333a40;
    --accent: #4fc3cd;
    --accent-soft: #1b3a3e;
    --pass: #5ec684;
    --warn: #d9a441;
    --fail: #e8766a;
    --na: #7b858e;
    --band: #21262a;
    --band-strong: #272d32;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #15181b;
  --panel: #1d2125;
  --ink: #e8eaec;
  --ink-soft: #9aa3ab;
  --rule: #333a40;
  --accent: #4fc3cd;
  --accent-soft: #1b3a3e;
  --pass: #5ec684;
  --warn: #d9a441;
  --fail: #e8766a;
  --na: #7b858e;
  --band: #21262a;
  --band-strong: #272d32;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 1400px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 56px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; }
h1 { font-size: 1.5rem; letter-spacing: -0.01em; }
h2 { font-size: 1.05rem; }
h3 { font-size: 0.95rem; }
a { color: var(--accent); }
.mono { font-family: var(--font-mono); font-variant-ligatures: none; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow {
  font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.09em;
  color: var(--ink-soft); font-weight: 600;
}

/* ---- header ---- */
header.top { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: flex-end; margin-bottom: 4px; }
.locus { display: flex; flex-wrap: wrap; gap: 4px 20px; align-items: baseline; }
.gene { font-family: var(--font-display); font-size: 1.9rem; font-weight: 600; line-height: 1; }
.facts { display: flex; flex-wrap: wrap; gap: 2px 18px; font-size: 0.8rem; color: var(--ink-soft); }
.facts b { color: var(--ink); font-weight: 500; }
.notice {
  margin: 14px 0 0; padding: 10px 12px; border-left: 3px solid var(--warn);
  background: var(--panel); font-size: 0.82rem; color: var(--ink-soft);
}
.notice b { color: var(--ink); }
.notice ul { margin: 6px 0 0; padding-left: 18px; }

/* ---- controls ---- */
.controls {
  display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center;
  margin: 18px 0 10px; padding: 10px 0; border-block: 1px solid var(--rule);
}
.control { display: flex; align-items: center; gap: 7px; font-size: 0.8rem; color: var(--ink-soft); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
.seg button {
  font: inherit; font-size: 0.78rem; padding: 4px 11px; border: 0; cursor: pointer;
  background: var(--panel); color: var(--ink-soft);
}
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--paper); font-weight: 600; }
button.plain {
  font: inherit; font-size: 0.78rem; padding: 4px 10px; cursor: pointer;
  background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 3px;
}
button.plain:hover { border-color: var(--accent); }
label.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- browser ---- */
.browser {
  position: relative; background: var(--panel); border: 1px solid var(--rule);
  border-radius: 3px; overflow: hidden; user-select: none;
}
.ruler { position: relative; height: 26px; border-bottom: 1px solid var(--rule); }
.tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--rule); }
.tick span {
  position: absolute; left: 3px; top: 5px; font-size: 0.66rem; color: var(--ink-soft);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.band { position: absolute; top: 0; bottom: 0; pointer-events: none; }
.track { position: relative; border-bottom: 1px solid var(--rule); }
.track:last-child { border-bottom: 0; }
.track-label {
  position: absolute; left: 6px; top: 3px; z-index: 4;
  font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--ink-soft); font-weight: 600; pointer-events: none;
  background: color-mix(in srgb, var(--panel) 78%, transparent); padding: 0 3px;
}
.feat {
  position: absolute; border-radius: 2px; cursor: pointer; min-width: 2px;
  font-size: 0.64rem; line-height: 14px; white-space: nowrap; overflow: hidden;
  color: var(--paper); padding-inline: 3px;
}
.feat.clipped { border-inline: 2px dotted var(--paper); }
.tssline { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); z-index: 3; }
.tssline.alt { width: 0; border-left: 2px dashed var(--warn); opacity: 0.85; }
.tsslabel {
  position: absolute; z-index: 5; font-size: 0.64rem; font-weight: 600; color: var(--accent);
  background: var(--panel); padding: 0 3px; top: 2px; white-space: nowrap;
}
canvas { display: block; width: 100%; }
.hint { font-size: 0.74rem; color: var(--ink-soft); margin: 7px 0 0; }

/* ---- split ---- */
.split { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 22px; margin-top: 26px; }
@media (max-width: 920px) { .split { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 3px; }
.card > header { padding: 11px 13px; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card > .body { padding: 13px; }
.scroll { max-height: 460px; overflow-y: auto; }

table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
th, td { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--rule); }
th { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-soft); position: sticky; top: 0; background: var(--panel); z-index: 1; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--band); }
tbody tr[aria-selected="true"] { background: var(--accent-soft); }
.pill {
  display: inline-block; font-size: 0.66rem; font-weight: 600; padding: 1px 6px;
  border-radius: 9px; border: 1px solid currentColor;
}
.pill.pass { color: var(--pass); }
.pill.fail { color: var(--fail); }
.pill.na { color: var(--na); }
.pill.warn { color: var(--warn); }

.meter { display: flex; gap: 2px; align-items: center; }
.meter i { width: 7px; height: 11px; border-radius: 1px; background: var(--rule); display: block; }
.meter i.on { background: var(--pass); }

dl.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 14px; margin: 0; font-size: 0.8rem; }
dl.kv dt { color: var(--ink-soft); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }

.strand { margin: 10px 0; }
.strand .lab { font-size: 0.68rem; color: var(--ink-soft); margin-bottom: 2px; }
.strand .seq {
  font-family: var(--font-mono); font-size: 0.82rem; letter-spacing: 0.04em;
  word-break: break-all; background: var(--band); padding: 6px 8px; border-radius: 2px;
}
.rule-row { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--rule); font-size: 0.8rem; }
.rule-row:last-child { border-bottom: 0; }
.rule-row .what { font-weight: 500; }
.rule-row .why { color: var(--ink-soft); font-size: 0.76rem; }
.rule-row .src { color: var(--ink-soft); font-size: 0.72rem; margin-top: 3px; font-style: italic; }
.rule-row details { margin-top: 5px; }
.rule-row summary { cursor: pointer; font-size: 0.72rem; color: var(--ink-soft); }
.rule-row summary:hover { color: var(--ink); }
.rule-row details > p { font-size: 0.76rem; color: var(--ink-soft); }
.rule-row details > p b { color: var(--ink); }
.tag {
  display: inline-block; font-size: 0.64rem; letter-spacing: 0.04em; text-transform: uppercase;
  padding: 0 4px; border: 1px solid currentColor; border-radius: 3px; vertical-align: 1px;
  color: var(--ink-soft); font-weight: 400;
}
.tag.established { color: var(--pass); }
.tag.exploratory { color: var(--warn); }
.tag.unsourced { color: var(--fail); }
.measure { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; margin: 5px 0 0; }
.measure dt { color: var(--ink-soft); font-size: 0.74rem; font-family: var(--font-mono); }
.measure dd { margin: 0; font-size: 0.74rem; font-variant-numeric: tabular-nums; }
.bar { height: 9px; background: var(--band-strong); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--fail); }
.empty { color: var(--ink-soft); font-size: 0.82rem; }
.cellnote { font-size: 0.78rem; color: var(--ink-soft); margin: 8px 0 0; }
.marks { display: grid; gap: 7px; margin: 10px 0 0; }
.markrow { display: grid; grid-template-columns: 82px minmax(0, 1fr) 62px; gap: 8px; align-items: center; }
.markrow .mk { font-size: 0.72rem; font-family: var(--font-mono); }
.markrow .fold { font-size: 0.72rem; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
.markrow .fold.on { color: var(--pass); font-weight: 600; }
.spark { height: 18px; background: var(--band); border-radius: 2px; overflow: hidden; position: relative; }
.spark canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
footer.src { margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--rule); font-size: 0.75rem; color: var(--ink-soft); }
footer.src ul { margin: 6px 0 0; padding-left: 18px; }
#loading { padding: 40px 0; text-align: center; color: var(--ink-soft); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script id="view-data" type="application/json">__VIEW_DATA__</script>

<div class="wrap">
  <div id="loading">
    <p class="eyebrow">Loading design run</p>
    <p>The promoter, its candidates and its annotations will appear here.</p>
  </div>
  <div id="app" hidden></div>
</div>

<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("view-data").textContent);
  const app = document.getElementById("app");
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* TSS-relative numbering has no zero: +1 is the first transcribed base, -1 the base before. */
  const tssStart = DATA.promoter.tss_start;
  function tssAt(offset) {
    if (tssStart == null) return null;
    const v = tssStart + offset;
    return v >= 0 ? v + 1 : v;
  }
  const signed = (v) => (v == null ? "n/a" : (v > 0 ? "+" + v : String(v)));
  const promLen = DATA.promoter.length;

  const state = {
    view: [0, promLen],          // visible promoter offsets
    selected: null,
    show: "passing",             // passing | all
    cell: (DATA.cell_types[0] || {}).id || null,
    showMotifs: true,
  };

  /* ---------------- header ---------------- */
  function header() {
    const g = DATA.gene, t = DATA.transcript, p = DATA.promoter, c = DATA.configuration;
    const name = g ? g.symbol : "Pasted promoter";
    const facts = [];
    if (p.contig) facts.push(["Locus", `chr${p.contig}:${p.start.toLocaleString()}–${p.end.toLocaleString()}`]);
    if (p.strand) facts.push(["Strand", p.strand === "-" ? "minus" : "plus"]);
    if (p.assembly) facts.push(["Assembly", p.assembly]);
    facts.push(["Promoter", `${p.length.toLocaleString()} bp, ${p.gc_percent}% GC`]);
    if (t) facts.push(["Transcript", `${t.ensembl_id}${t.refseq_match ? " / " + t.refseq_match : ""}${t.is_mane_select ? " (MANE Select)" : ""}`]);
    const presetLabel = c.preset.name || c.preset.id;
    facts.push(["Rules", c.is_custom && presetLabel
      ? `Custom, based on ${presetLabel}` : presetLabel || "custom"]);

    let html = `<header class="top">
      <div class="locus">
        <span class="gene">${esc(name)}</span>
        ${g ? `<span class="mono" style="color:var(--ink-soft);font-size:.8rem">${esc(g.ensembl_id)}</span>` : ""}
      </div>
    </header>
    ${g && g.description ? `<p style="margin:2px 0 10px;color:var(--ink-soft);font-size:.85rem">${esc(g.description)}</p>` : ""}
    <div class="facts">${facts.map(([k, v]) => `<span>${esc(k)} <b>${esc(v)}</b></span>`).join("")}</div>`;

    const div = (c.preset.divergences || []);
    if (div.length) {
      html += `<div class="notice"><b>This preset departs from what it reproduces.</b><ul>${
        div.map((d) => `<li>${esc(d)}</li>`).join("")}</ul></div>`;
    }
    if (DATA.unevaluated_rules.length) {
      html += `<div class="notice"><b>Rules that could not be evaluated for any candidate:</b>
        <span class="mono">${DATA.unevaluated_rules.map(esc).join(", ")}</span>.
        Reported once here rather than per candidate. They neither excluded nor scored anything.</div>`;
    }
    return html;
  }

  /* ---------------- controls ---------------- */
  function controls() {
    const cells = DATA.cell_types.map((c) =>
      `<button type="button" data-cell="${esc(c.id)}" aria-pressed="${c.id === state.cell}">${esc(c.name)}</button>`
    ).join("");
    return `<div class="controls">
      <span class="control">Candidates
        <span class="seg">
          <button type="button" data-show="passing" aria-pressed="${state.show === "passing"}">Passing</button>
          <button type="button" data-show="all" aria-pressed="${state.show === "all"}">All</button>
        </span>
      </span>
      ${cells ? `<span class="control">Cell type <span class="seg" id="cellseg">${cells}</span></span>` : ""}
      <label class="check control"><input type="checkbox" id="motiftoggle" ${state.showMotifs ? "checked" : ""}> Motif predictions</label>
      <span class="control" style="margin-left:auto">
        <button class="plain" type="button" id="zoomout">Zoom out</button>
        <button class="plain" type="button" id="zoomfit">Whole promoter</button>
      </span>
    </div>`;
  }

  /* ---------------- the rules this run applied ----------------
     Rule records appear once in the configuration and each candidate's results reference them by
     id, so everything that explains a verdict (the citation, the evidence class, the reasoning,
     every threshold with its unit and legal range, and the options not chosen) is one lookup
     away rather than repeated on every result. */
  const RULES = Object.fromEntries((DATA.configuration.rules || []).map((r) => [r.id, r]));

  function parameterOf(ruleId, name) {
    const rule = RULES[ruleId];
    if (!rule) return null;
    return (rule.parameters || []).find((p) => p.name === name) || null;
  }

  function valueOf(ruleId, name) {
    const p = parameterOf(ruleId, name);
    return p == null ? null : p.value;
  }

  /* Read from the configuration that produced these candidates, never assumed. These bounds used
     to be hardcoded to Wang's -1000..-100, so a run using the thesis's -2000..0 option or the
     strict preset's -500..-200 drew a band contradicting its own rules, and captioned it as
     "the window the rules admit". A rule the run did not apply yields null and draws nothing. */
  function windowOf(ruleId, startName, endName) {
    const start = valueOf(ruleId, startName), end = valueOf(ruleId, endName);
    return start == null || end == null ? null : [start, end];
  }

  const ADMITTED = windowOf("tss-window", "window-start-bp", "window-end-bp");
  const PREFERRED = windowOf(
    "tss-preferred-window", "preferred-window-start-bp", "preferred-window-end-bp");
  const ADMITTED_KIND = (RULES["tss-window"] || {}).kind || null;

  /* ---------------- track browser ---------------- */

  function offsetOfTss(target) {
    if (tssStart == null) return null;
    const o = target > 0 ? target - 1 - tssStart : target - tssStart;
    return o;
  }

  function browser() {
    return `<div class="browser" id="browser">
      <div class="ruler" id="ruler"></div>
      <div class="track" id="t-context" style="height:20px"></div>
      <div class="track" id="t-reg" style="height:40px"><span class="track-label">Regulatory build</span></div>
      <div class="track" id="t-motif" style="height:52px"><span class="track-label">Motif predictions</span></div>
      <div class="track" id="t-cand" style="height:84px"><span class="track-label">Candidates</span>
        <canvas id="cand"></canvas>
      </div>
    </div>
    <p class="hint">Drag to pan, scroll or pinch to zoom, click a candidate to inspect it.
    ${bandCaption()}</p>`;
  }

  /* Describes only the bands actually drawn, in the terms the configuration actually used. A
     window applied as a preference is not "the window the rules admit", so it does not say so. */
  function bandCaption() {
    const parts = [];
    if (ADMITTED) {
      const verb = ADMITTED_KIND === "mandatory"
        ? "the window the rules admit"
        : "the window the rules prefer, applied as a preference rather than a gate";
      parts.push(`${verb} (${signed(ADMITTED[0])} to ${signed(ADMITTED[1])})`);
    }
    if (PREFERRED) {
      parts.push(`the region the paper reports activity in (${signed(PREFERRED[0])} to ${signed(PREFERRED[1])})`);
    }
    if (!parts.length) {
      return `No position rule was applied in this run, so no window is marked.`;
    }
    return `Shaded bands mark ${parts.join(" and ")}.`;
  }

  function pxPerBase(width) { return width / (state.view[1] - state.view[0]); }
  function xOf(offset, width) { return (offset - state.view[0]) * pxPerBase(width); }

  function drawRuler(width) {
    const ruler = document.getElementById("ruler");
    const span = state.view[1] - state.view[0];
    const steps = [10, 25, 50, 100, 250, 500, 1000, 2500, 5000];
    const step = steps.find((s) => span / s <= 14) || 10000;
    let html = "";
    const first = Math.ceil(state.view[0] / step) * step;
    for (let o = first; o <= state.view[1]; o += step) {
      const x = xOf(o, width);
      html += `<div class="tick" style="left:${x}px"><span>${esc(signed(tssAt(o)))}</span></div>`;
    }
    ruler.innerHTML = html;
  }

  function drawContext(width) {
    const t = document.getElementById("t-context");
    let html = "";
    const bands = [[ADMITTED, "var(--band)"], [PREFERRED, "var(--band-strong)"]];
    for (const [range, colour] of bands) {
      if (range == null) continue;
      const a = offsetOfTss(range[0]), b = offsetOfTss(range[1]);
      if (a == null) continue;
      const left = xOf(Math.min(a, b), width), right = xOf(Math.max(a, b), width);
      html += `<div class="band" style="left:${left}px;width:${Math.max(0, right - left)}px;background:${colour}"></div>`;
    }
    for (const island of DATA.tracks.cpg_islands) {
      const left = xOf(island.start, width), right = xOf(island.end, width);
      html += `<div class="feat" title="${esc(island.detail)}" style="left:${left}px;width:${Math.max(2, right - left)}px;top:2px;height:15px;background:var(--warn)">CpG island</div>`;
    }
    const tssOffset = DATA.promoter.tss_offset;
    if (tssOffset != null) {
      html += `<div class="tssline" style="left:${xOf(tssOffset, width)}px"></div>`;
      html += `<div class="tsslabel" style="left:${xOf(tssOffset, width) + 4}px">TSS +1</div>`;
    }
    for (const alt of DATA.tracks.alternative_tss) {
      html += `<div class="tssline alt" title="${esc(alt.detail)}" style="left:${xOf(alt.start, width)}px"></div>`;
    }
    t.innerHTML = html;
  }

  function lay(items, width, rows) {
    /* Greedy row packing so overlapping features stay readable. */
    const ends = new Array(rows).fill(-Infinity);
    return items.map((item) => {
      const left = xOf(item.start, width), right = Math.max(left + 2, xOf(item.end, width));
      let row = ends.findIndex((e) => e < left - 2);
      if (row < 0) row = 0;
      ends[row] = right;
      return { item, left, right, row };
    });
  }

  const REG_COLOUR = {
    "regulatory-promoter": "var(--pass)",
    "regulatory-promoter_flanking_region": "var(--accent)",
    "regulatory-enhancer": "var(--warn)",
    "regulatory-CTCF_binding_site": "var(--na)",
  };

  function drawRegulatory(width) {
    const t = document.getElementById("t-reg");
    const items = DATA.tracks.regulatory.filter((f) => f.end > state.view[0] && f.start < state.view[1]);
    let html = `<span class="track-label">Regulatory build</span>`;
    if (!items.length) {
      const note = (DATA.regulatory_summary && DATA.regulatory_summary.caveat) ||
        "Nothing annotated in view.";
      html += `<div style="position:absolute;left:140px;top:11px;font-size:.74rem;color:var(--ink-soft);right:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(note)}">${esc(note)}</div>`;
    }
    for (const p of lay(items, width, 2)) {
      html += `<div class="feat ${p.item.clipped ? "clipped" : ""}" data-detail="${esc(p.item.detail)}"
        title="${esc(p.item.label + ": " + p.item.detail)}"
        style="left:${p.left}px;width:${p.right - p.left}px;top:${16 + p.row * 17}px;height:15px;background:${REG_COLOUR[p.item.kind] || "var(--na)"}">${esc(p.item.label)}</div>`;
    }
    t.innerHTML = html;
  }

  function drawMotifs(width) {
    const t = document.getElementById("t-motif");
    let html = `<span class="track-label">Motif predictions</span>`;
    if (!state.showMotifs) {
      t.innerHTML = html + `<div style="position:absolute;left:140px;top:17px;font-size:.74rem;color:var(--ink-soft)">Hidden.</div>`;
      return;
    }
    const items = DATA.tracks.motifs.filter((f) => f.end > state.view[0] && f.start < state.view[1]);
    if (!items.length) {
      html += `<div style="position:absolute;left:140px;top:17px;font-size:.74rem;color:var(--ink-soft)">No motif above what base composition alone explains, in view.</div>`;
    }
    for (const p of lay(items, width, 3)) {
      html += `<div class="feat" data-detail="${esc(p.item.detail)}" title="${esc(p.item.detail)}"
        style="left:${p.left}px;width:${p.right - p.left}px;top:${16 + p.row * 12}px;height:11px;line-height:11px;background:var(--accent);font-size:.6rem">${esc(p.item.label)}</div>`;
    }
    t.innerHTML = html;
  }

  function candidatesInView() {
    return DATA.candidates.filter((c) => c.offset + 19 > state.view[0] && c.offset < state.view[1]);
  }

  function drawCandidates(width) {
    const canvas = document.getElementById("cand");
    const dpr = window.devicePixelRatio || 1;
    const height = 84;
    canvas.width = Math.max(1, Math.floor(width * dpr));
    canvas.height = Math.floor(height * dpr);
    canvas.style.height = height + "px";
    const g = canvas.getContext("2d");
    g.scale(dpr, dpr);
    g.clearRect(0, 0, width, height);
    const css = getComputedStyle(document.body);
    const colour = (name) => css.getPropertyValue(name).trim() || "#888";
    const pass = colour("--pass"), fail = colour("--fail"), accent = colour("--accent");
    const base = 74, top = 20;

    g.strokeStyle = colour("--rule");
    g.beginPath(); g.moveTo(0, base + 0.5); g.lineTo(width, base + 0.5); g.stroke();

    const items = candidatesInView();
    const max = DATA.candidates.length ? (DATA.candidates[0].max_preference_points ?? 0) : 0;
    for (const c of items) {
      const x = xOf(c.offset, width);
      const w = Math.max(1, 19 * pxPerBase(width));
      const rejected = (c.excluded_by || []).length > 0;
      if (rejected) {
        if (state.show !== "all") continue;
        g.fillStyle = fail; g.globalAlpha = 0.28;
        g.fillRect(x, base - 5, w, 5);
      } else {
        const frac = max ? c.preference_points / max : 0;
        const h = 6 + frac * (base - top - 6);
        g.globalAlpha = 1;
        g.fillStyle = (state.selected === c.id) ? accent : pass;
        g.fillRect(x, base - h, w, h);
      }
    }
    g.globalAlpha = 1;
    if (state.selected) {
      const sel = DATA.candidates.find((c) => c.id === state.selected);
      if (sel) {
        const x = xOf(sel.offset, width);
        g.strokeStyle = accent; g.lineWidth = 1.5;
        g.beginPath(); g.moveTo(x, 0); g.lineTo(x, base); g.stroke();
      }
    }
  }

  function redrawTracks() {
    const el = document.getElementById("browser");
    if (!el) return;
    const width = el.clientWidth;
    drawRuler(width); drawContext(width); drawRegulatory(width);
    drawMotifs(width); drawCandidates(width);
  }

  /* ---------------- candidate list ---------------- */
  function list() {
    const ranked = DATA.candidates
      .filter((c) => (state.show === "all" ? true : !(c.excluded_by || []).length))
      .sort((a, b) => {
        const ar = a.rank == null ? 1e9 : a.rank, br = b.rank == null ? 1e9 : b.rank;
        return ar - br || a.offset - b.offset;
      });
    const rows = ranked.slice(0, 400).map((c) => {
      const rejected = (c.excluded_by || []).length > 0;
      const span = c.tss_span ? `${signed(c.tss_span[0])} to ${signed(c.tss_span[1])}` : "n/a";
      const max = c.max_preference_points ?? 0;
      const meter = Array.from({ length: max }, (_, i) =>
        `<i class="${i < c.preference_points ? "on" : ""}"></i>`).join("");
      return `<tr data-id="${esc(c.id)}" aria-selected="${state.selected === c.id}">
        <td class="n">${c.rank == null ? "n/a" : c.rank}</td>
        <td class="mono">${esc(c.id)}</td>
        <td class="num">${esc(span)}</td>
        <td class="n num">${c.gc_percent}</td>
        <td>${rejected
          ? `<span class="pill fail">rejected</span>`
          : max
            ? `<span class="meter" title="${c.preference_points} of ${max} preferences">${meter}</span>`
            : `<span class="hint">no preferences applied</span>`}</td>
      </tr>`;
    }).join("");
    const shown = Math.min(400, ranked.length);
    return `<section class="card">
      <header>
        <h2>Candidates</h2>
        <span class="eyebrow">${DATA.counts.passing} passing of ${DATA.counts.generated} generated</span>
      </header>
      <div class="body scroll" style="padding:0">
        <table><thead><tr>
          <th class="n">Rank</th><th>Id</th><th>Position vs TSS</th><th class="n">GC%</th><th>Score</th>
        </tr></thead><tbody id="rows">${rows}</tbody></table>
        ${shown < ranked.length ? `<p class="hint" style="padding:8px 10px">Showing the first ${shown} of ${ranked.length}. Zoom the browser to find others by position.</p>` : ""}
      </div>
    </section>`;
  }

  /* ---------------- detail ---------------- */
  /* ---------------- joining a verdict to the rule behind it ----------------
     The page used to show a kebab id, a verdict pill and a sentence, while the data carried the
     rule's name, its citation, its evidence class, the reasoning for it, every threshold with its
     unit and legal range, and the alternatives not chosen. The footer claimed otherwise. */

  const EVIDENCE_NOTE = {
    established: "Published support in the source setting; saRNA predictive benefit is not established.",
    empirical: "Published observation or recommendation; not a universal activation requirement.",
    exploratory: "Hypothesis; improved saRNA activation has not been demonstrated.",
  };

  function evidenceTag(rule) {
    if (!rule) return "";
    const warn = rule.provenance && rule.provenance.is_warning;
    const label = warn ? "unsourced" : (rule.evidence_class || "");
    if (!label) return "";
    const title = warn
      ? "No source could be traced for this rule. It must not be read as established biology."
      : (rule.evidence_note || EVIDENCE_NOTE[rule.evidence_class] || "");
    const display = {established:"published support in source setting",
      empirical:"published observation or guidance", exploratory:"exploratory hypothesis"};
    return `<span class="tag ${esc(label)}" title="${esc(title)}">${esc(display[label] || label)}</span>`;
  }

  function citationLine(rule) {
    if (!rule || !rule.provenance) return "";
    const p = rule.provenance;
    const text = p.kind === "unsourced" ? "No source traced. " + (p.note || "") : p.display;
    const link = typeof p.url === "string" && /^https:\/\//.test(p.url)
      ? `<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(text || "")}</a>`
      : esc(text || "");
    return `<div class="src">${link}</div><p>${esc(rule.evidence_note || "Evidence scope was not recorded; a citation does not validate activation prediction.")}</p><p>${esc(rule.application_note || "Gate and preference describe software behavior, not evidence strength.")}</p>`;
  }

  function parameterValue(rule, name) {
    const p = (rule.parameters || []).find((x) => x.name === name);
    return p === undefined ? null : p.value;
  }

  function thresholdRows(rule) {
    if (!rule || !(rule.parameters || []).length) return "";
    const rows = rule.parameters.map((p) => {
      const unit = p.unit ? " " + p.unit : "";
      const range = (p.minimum != null && p.maximum != null)
        ? `, within a permitted ${p.minimum} to ${p.maximum}` : "";
      const diverged = p.is_default === false ? `, where the default is ${p.default}` : "";
      return `<dt>${esc(p.name)}</dt><dd>${esc(String(p.value))}${esc(unit)}${esc(range)}${esc(diverged)}
        <div class="hint" style="margin:1px 0 0">${esc(p.description)}</div></dd>`;
    }).join("");
    return `<dl class="measure">${rows}</dl>`;
  }

  function measurementRows(result) {
    const measured = result.measurements || {};
    const keys = Object.keys(measured);
    if (!keys.length) return "";
    const rows = keys.map((k) =>
      `<dt>${esc(k)}</dt><dd>${esc(String(measured[k]))}</dd>`).join("");
    return `<dl class="measure">${rows}</dl>`;
  }

  /* A matching value is distinct from a deliberate sourced choice. Manual overrides can also
     change a selected option; preserve both its provenance and the effective values. */
  function optionList(rule) {
    if (!rule || !(rule.options || []).length) return "";
    const rows = rule.options.map((o) => {
      const matches = Object.keys(o.values).every((k) => parameterValue(rule, k) === o.values[k]);
      const selected = rule.selected_option && rule.selected_option.id === o.id;
      const label = selected ? (matches ? "selected" : "selected, then adjusted")
        : matches ? "values match" : "not used";
      return `<div class="rule-row" style="border-bottom:0;padding:5px 0">
        <div><span class="pill ${selected || matches ? "pass" : "na"}">${label}</span></div>
        <div><div class="what">${esc(o.label)}</div>
          <div class="why">${esc(o.note)}</div>
          <div class="src">${esc(o.provenance.display)}</div></div></div>`;
    }).join("");
    return `<p style="margin:8px 0 2px"><b>Alternatives.</b> Other sourced settings for this
      rule, and what each costs.</p>${rows}`;
  }

  function ruleVerdict(result) {
    const rule = RULES[result.id];
    const cls = result.outcome === "pass" ? "pass" : result.outcome === "fail" ? "fail" : "na";
    const label = result.outcome === "not-applicable" ? "n/a" : result.outcome;
    const measured = measurementRows(result);
    const thresholds = thresholdRows(rule);
    const reasoning = rule
      ? `<p style="margin:6px 0 0"><b>Why it matters.</b> ${esc(rule.rationale)}</p>
         <p style="margin:6px 0 0"><b>Changing it.</b> ${esc(rule.consequence)}</p>`
      : "";
    const inner = reasoning
      + (measured ? `<p style="margin:8px 0 2px"><b>Measured here.</b></p>${measured}` : "")
      + (thresholds ? `<p style="margin:8px 0 2px"><b>Judged against.</b></p>${thresholds}` : "")
      + optionList(rule);
    return `<div class="rule-row">
      <div><span class="pill ${cls}">${esc(label)}</span></div>
      <div>
        <div class="what">${esc(rule ? rule.name : result.id)} ${evidenceTag(rule)}${
          result.points ? ` <span class="hint" style="margin:0">· 1 point</span>` : ""}</div>
        <div class="why">${esc(result.detail)}</div>
        <div class="src mono" style="font-style:normal;font-size:.7rem">${esc(result.id)}</div>
        ${citationLine(rule)}
        ${inner ? `<details><summary>Reasoning, measurements and thresholds</summary>${inner}</details>` : ""}
      </div></div>`;
  }

  /* ---------------- the run's own configuration ----------------
     ADR 0003 promised a settings panel and there was none, so a reader could not see what the run
     applied without selecting a candidate first. */
  function rulesPanel() {
    const entries = DATA.configuration.rules || [];
    const disabled = DATA.configuration.disabled_rules || [];
    if (!entries.length && !disabled.length) return "";
    const byKind = {};
    for (const r of entries) (byKind[r.kind] = byKind[r.kind] || []).push(r);
    byKind.off = disabled;
    const roleNote = (r) => r.kind === "off"
      ? `<p class="hint">Disabled for this run. No verdict, exclusion or preference point.</p>`
      : r.kind_overridden
        ? `<p class="hint">Catalogue role: ${esc(r.default_kind)}. This run: ${esc(r.kind)}.</p>`
        : "";
    const changes = DATA.configuration.customizations || [];
    const customNote = DATA.configuration.is_custom
      ? `<div class="notice"><b>Custom configuration.</b> Settings are research choices;
          candidate ranks do not establish activation efficacy.
          ${changes.length ? `<ul>${changes.map((change) => `<li>${esc(change.rule_id)}:
            ${esc(change.setting)}, ${esc(String(change.before))} →
            ${esc(String(change.after))}</li>`).join("")}</ul>` : ""}</div>` : "";
    const warnings = (DATA.configuration.warnings || []).map((warning) =>
      `<div class="notice">${esc(warning)}</div>`).join("");
    const section = (kind, title, blurb) => {
      const rules = byKind[kind] || [];
      if (!rules.length) return "";
      return `<h3 style="margin-top:16px">${esc(title)}
          <span class="hint" style="margin:0">· ${rules.length}</span></h3>
        <p class="hint" style="margin-top:2px">${esc(blurb)}</p>`
        + rules.map((r) => `<div class="rule-row">
            <div>${evidenceTag(r)}</div>
            <div><div class="what">${esc(r.name)}</div>
              <div class="why">${esc(r.rationale)}</div>
              ${roleNote(r)}
              ${citationLine(r)}
              <details><summary>Thresholds, consequences and alternatives</summary>
                <p style="margin:6px 0 0"><b>Changing it.</b> ${esc(r.consequence)}</p>
                ${thresholdRows(r)}${optionList(r)}</details>
            </div></div>`).join("");
    };
    const warned = entries.filter((r) => r.provenance && r.provenance.is_warning);
    const plural = warned.length > 1;
    return `<section class="card"><header><h2>Rules and their sources</h2>
      <span class="eyebrow">${entries.length} applied</span></header>
      <div class="body scroll">
      ${customNote}
      ${warnings}
      ${warned.length ? `<div class="notice" style="border-color:var(--fail)">
        <b>${warned.length} rule${plural ? "s" : ""} with no traceable source.</b>
        <div style="margin-top:4px">${warned.map((r) => esc(r.name)).join(", ")}. Carried so
        historical rankings stay explainable, not because ${plural ? "they are" : "it is"}
        believed. Do not read ${plural ? "them" : "it"} as established biology.</div></div>` : ""}
      ${section("mandatory", "Gates", "A candidate failing any of these is excluded outright.")}
      ${section("preference", "Preferences",
        "One point each, equal weight. Never a weighted sum, which is what made the original "
        + "score uninterpretable (ADR 0006).")}
      ${section("tiebreak", "Tie-breaks",
        "Used only to order candidates that met the same number of preferences.")}
      ${section("off", "Disabled rules",
        "These criteria were explicitly switched off and were not evaluated.")}
      </div></section>`;
  }

  function detail() {
    const c = DATA.candidates.find((x) => x.id === state.selected);
    if (!c) {
      return `<section class="card"><header><h2>Candidate detail</h2></header>
        <div class="body"><p class="empty">Select a candidate in the table or on the browser to see
        every rule verdict, the duplex strands, and which nearest-neighbour tables agree about
        the guide strand.</p></div></section>`;
    }
    const rejected = (c.excluded_by || []).length > 0;
    const max = c.max_preference_points ?? 0;
    let body = `<dl class="kv">
      <dt>Position</dt><dd>${c.tss_span ? esc(signed(c.tss_span[0]) + " to " + signed(c.tss_span[1]) + " relative to the TSS") : "no TSS anchor"}
        ${c.genomic ? `<br><span class="mono" style="font-size:.76rem">chr${esc(c.genomic.contig)}:${c.genomic.start.toLocaleString()}–${c.genomic.end.toLocaleString()} (${esc(c.genomic.strand)})</span>` : ""}</dd>
      <dt>GC content</dt><dd class="num">${c.gc_percent}%</dd>
      <dt>Score</dt><dd>${esc(c.score_summary
        || (max ? c.preference_points + " of " + max + " preferences met"
                : "no preferences were applied in this run"))}</dd>
    </dl>`;

    if (rejected) {
      body += `<div class="notice" style="border-color:var(--fail)"><b>Excluded by ${c.excluded_by.map(esc).join(", ")}.</b>
        <div style="margin-top:4px">${esc(c.rejection_summary || "")}</div></div>`;
    }

    body += `<div class="strand"><div class="lab">Target site (DNA, 5'→3')</div>
      <div class="seq">${esc(c.target_site_dna)}</div></div>`;
    if (c.antisense_strand_rna) {
      body += `<div class="strand"><div class="lab">Guide / antisense strand (RNA, 5'→3')</div>
        <div class="seq">${esc(c.antisense_strand_rna)}</div></div>
        <div class="strand"><div class="lab">Passenger / sense strand (RNA, 5'→3')</div>
        <div class="seq">${esc(c.sense_strand_rna)}</div></div>`;
    }

    if (c.guide_prediction) {
      const gp = c.guide_prediction;
      body += `<h3 style="margin-top:16px">Guide strand prediction</h3>
        <p class="hint" style="margin-top:2px">${esc(gp.summary || "")}</p>`;
      body += (gp.assessments || []).map((a) => `<div class="rule-row">
        <div><span class="pill ${gp.tables_agree ? "pass" : "warn"}">${esc(String(a.predicted_guide))}</span></div>
        <div><div class="what mono" style="font-size:.76rem">${esc(a.table)} · ${a.difference == null ? "" : a.difference.toFixed(2)} ${esc(a.unit || "")}</div>
        <div class="why">${esc(a.explanation || "")}</div></div></div>`).join("");
    }

    if (c.rules && c.rules.length) {
      body += `<h3 style="margin-top:16px">Every rule applied</h3>
        <p class="hint" style="margin-top:2px">Each verdict carries the source it rests on. Open a
        row for the reasoning, the thresholds it was judged against and what changing them does.</p>`;
      body += c.rules.map((r) => ruleVerdict(r)).join("");
    } else {
      body += `<p class="hint" style="margin-top:14px">Per-rule measurements were abbreviated for
        rejected candidates in this export. The rules that excluded it are listed above.</p>`;
    }

    return `<section class="card"><header><h2>${esc(c.id)}</h2>
      <span class="eyebrow">${rejected ? "rejected" : "rank " + (c.rank || "n/a")}</span></header>
      <div class="body scroll">${body}</div></section>`;
  }

  /* ---------------- lower panels ---------------- */
  function axesBlock(cell) {
    const axes = cell.data_axes || [];
    if (!axes.length) return "";
    const rows = axes.map((a) => {
      const state = a.available ? "loaded" : (a.reachable ? "reachable" : "no route");
      const cls = a.available ? "pass" : (a.reachable ? "warn" : "na");
      return `<div class="markrow" style="grid-template-columns:104px minmax(0,1fr) 78px">
        <span class="mk">${esc(a.axis)}</span>
        <span style="font-size:.74rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
          title="${esc(a.note)}">${esc(a.question)}</span>
        <span style="text-align:right"><span class="pill ${cls}">${esc(state)}</span></span>
      </div>`;
    }).join("");
    return `<h3 style="margin-top:14px;font-size:.9rem">What is known in this cell type</h3>
      <div class="marks">${rows}</div>`;
  }

  function chromatinBlock(cell) {
    const chrom = cell.chromatin;
    if (!chrom) return "";
    if (!chrom.readable) {
      return `<p class="cellnote"><b>Chromatin state could not be read.</b> ${esc(chrom.problem || "")}
        ${esc(chrom.problem_detail || "")}</p>`;
    }
    const rows = (chrom.signals || []).map((s) => `<div class="markrow">
      <span class="mk" title="${esc(s.interpretation)}">${esc(s.mark)}</span>
      <span class="spark" data-mark="${esc(s.mark)}" data-cell="${esc(cell.id)}"><canvas></canvas></span>
      <span class="fold ${s.present ? "on" : ""}" title="mean ${s.mean}, background median ${s.background_median}">${s.fold_over_background}×</span>
    </div>`).join("");
    return `<h3 style="margin-top:14px;font-size:.9rem">Chromatin at this promoter</h3>
      <p class="hint" style="margin-top:2px">${esc(chrom.summary)}</p>
      <div class="marks">${rows}</div>
      <p class="cellnote">${esc(chrom.provenance)}. Fold is over the median of random same-contig
      windows of the same width; a mark counts as present above ${esc(String((chrom.signals[0] || {}).threshold ?? 5))}×.
      ${esc(chrom.assembly_note || "")}</p>`;
  }

  function drawSparklines() {
    const cell = DATA.cell_types.find((c) => c.id === state.cell);
    if (!cell || !cell.signal_tracks) return;
    const css = getComputedStyle(document.body);
    const line = css.getPropertyValue("--accent").trim() || "#0f6e76";
    for (const el of app.querySelectorAll(".spark[data-mark]")) {
      const values = cell.signal_tracks[el.dataset.mark];
      const canvas = el.querySelector("canvas");
      if (!values || !canvas) continue;
      const dpr = window.devicePixelRatio || 1;
      const w = el.clientWidth, h = el.clientHeight;
      canvas.width = Math.max(1, Math.floor(w * dpr));
      canvas.height = Math.max(1, Math.floor(h * dpr));
      const g = canvas.getContext("2d");
      g.scale(dpr, dpr);
      /* Scaled per mark against its own maximum: these are read-depth tracks, so one shared
         scale would flatten every mark except the strongest. */
      const peak = Math.max(...values, 1e-9);
      g.fillStyle = line;
      const step = w / values.length;
      values.forEach((v, i) => {
        const bar = Math.max(0.5, (v / peak) * h);
        g.fillRect(i * step, h - bar, Math.max(0.6, step), bar);
      });
    }
  }

  function cellPanel() {
    const cell = DATA.cell_types.find((c) => c.id === state.cell);
    if (!cell) return "";
    const motifCount = DATA.tracks.motifs.length;
    return `<section class="card"><header><h2>${esc(cell.name)}</h2>
      <span class="eyebrow">${cell.known ? esc(cell.status) : "no occupancy data"}</span></header>
      <div class="body">
        <p style="margin:0 0 8px">${esc(cell.description)}</p>
        <dl class="kv"><dt>Dividing</dt><dd>${cell.proliferating ? "yes" : "no"}</dd>
        <dt>Factor binding</dt><dd>${cell.known ? esc(cell.status) : "not assayed"}</dd></dl>
        ${axesBlock(cell)}
        ${chromatinBlock(cell)}
        ${cell.absence_note ? `<p class="cellnote"><b>What this panel cannot tell you.</b> ${esc(cell.absence_note)}</p>` : ""}
        <p class="cellnote">The ${motifCount} motif ${motifCount === 1 ? "match" : "matches"} drawn above
        are sequence predictions. They are computed without reference to any cell type and say
        nothing about whether a factor is bound in ${esc(cell.name)}.</p>
      </div></section>`;
  }

  function motifPanel() {
    const rows = DATA.motif_scans.map((s) => `<tr>
      <td><b>${esc(s.motif)}</b> <span class="mono" style="font-size:.72rem;color:var(--ink-soft)">${esc(s.matrix_id)}</span></td>
      <td class="n num">${s.sites}</td>
      <td class="n num">${s.expected}</td>
      <td class="n num">${s.enrichment == null ? "n/a" : s.enrichment.toFixed(2) + "×"}</td>
      <td>${s.exceeds_chance ? `<span class="pill pass">above chance</span>` : `<span class="pill na">chance</span>`}</td>
    </tr>`).join("");
    return `<section class="card"><header><h2>Motifs scanned</h2>
      <span class="eyebrow">matches vs what composition alone gives</span></header>
      <div class="body scroll" style="padding:0">
        <table><thead><tr><th>Factor</th><th class="n">Found</th><th class="n">Expected</th>
        <th class="n">Enrichment</th><th>Verdict</th></tr></thead><tbody>${rows}</tbody></table>
        <p class="hint" style="padding:9px 10px">Expected counts come from shuffles of this promoter
        that preserve its base composition. A promoter is GC-rich and so are most promoter-factor
        motifs, so a large match count on its own means little.</p>
      </div></section>`;
  }

  function rejectionPanel() {
    const breakdown = DATA.rejection_breakdown || [];
    if (!breakdown.length) {
      return `<section class="card"><header><h2>Rejections</h2></header>
        <div class="body"><p class="empty">No candidate was excluded.</p></div></section>`;
    }
    const worst = breakdown[0].percent_of_generated || 1;
    const rows = breakdown.map((b) => `<div style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;gap:10px;font-size:.78rem">
        <span class="mono">${esc(b.rule)}</span>
        <span class="num" style="color:var(--ink-soft)">${b.rejected.toLocaleString()} · ${b.percent_of_generated}%</span>
      </div>
      <div class="bar"><i style="width:${(b.percent_of_generated / worst) * 100}%"></i></div>
    </div>`).join("");
    return `<section class="card"><header><h2>Rejections by rule</h2>
      <span class="eyebrow">${DATA.counts.rejected.toLocaleString()} of ${DATA.counts.generated.toLocaleString()}</span></header>
      <div class="body">${rows}
      <p class="hint">A candidate can fail more than one rule, so these do not sum to the total.
      Every rejected candidate is kept in this export with the rules that excluded it.</p></div></section>`;
  }

  function footer() {
    const caveat = DATA.regulatory_summary;
    return `<footer class="src">
      <p><b>Provenance.</b> Every rule above carries its citation and evidence class, the reasoning
      behind it, the thresholds it was judged against with their units and legal ranges, and the
      sourced alternatives not chosen. See <i>Rules and their sources</i>, or open any verdict.
      The resolved configuration is embedded in this page's data rather than named by preset,
      because a preset's meaning can change between versions.</p>
      ${caveat ? `<p><b>Regulatory annotation.</b> ${esc(caveat.provenance)}. ${esc(caveat.summary)}
        ${caveat.caveat ? esc(caveat.caveat) : ""}</p>` : ""}
      <p><b>What a high rank is not.</b> Wang et al. report that of designed duplexes, 15–20%
      significantly activate the target gene, about 70% have no effect, and 5–10% suppress it. Rank
      here is a prioritisation aid, not a prediction of activity.</p>
    </footer>`;
  }

  /* ---------------- render ---------------- */
  function render() {
    app.innerHTML = header() + controls() + browser() +
      `<div class="split">${list()}${detail()}</div>` +
      `<div class="split">${cellPanel()}${rejectionPanel()}</div>` +
      `<div style="margin-top:22px">${motifPanel()}</div>` +
      `<div style="margin-top:22px">${rulesPanel()}</div>` + footer();
    wire();
    redrawTracks();
    drawSparklines();
  }

  function wire() {
    app.querySelectorAll("[data-show]").forEach((b) =>
      b.addEventListener("click", () => { state.show = b.dataset.show; render(); }));
    const seg = document.getElementById("cellseg");
    if (seg) seg.querySelectorAll("[data-cell]").forEach((b) =>
      b.addEventListener("click", () => { state.cell = b.dataset.cell; render(); }));
    const mt = document.getElementById("motiftoggle");
    if (mt) mt.addEventListener("change", () => { state.showMotifs = mt.checked; redrawTracks(); });
    const zo = document.getElementById("zoomout");
    if (zo) zo.addEventListener("click", () => zoom(1.6, 0.5));
    const zf = document.getElementById("zoomfit");
    if (zf) zf.addEventListener("click", () => { state.view = [0, promLen]; redrawTracks(); });

    const rows = document.getElementById("rows");
    if (rows) rows.addEventListener("click", (e) => {
      const tr = e.target.closest("tr[data-id]");
      if (tr) select(tr.dataset.id);
    });

    const browserEl = document.getElementById("browser");
    if (browserEl) {
      browserEl.addEventListener("wheel", (e) => {
        e.preventDefault();
        const rect = browserEl.getBoundingClientRect();
        zoom(e.deltaY > 0 ? 1.18 : 1 / 1.18, (e.clientX - rect.left) / rect.width);
      }, { passive: false });
      let dragging = false, lastX = 0;
      browserEl.addEventListener("pointerdown", (e) => {
        dragging = true; lastX = e.clientX; browserEl.setPointerCapture(e.pointerId);
      });
      browserEl.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const width = browserEl.clientWidth;
        const shift = (e.clientX - lastX) / pxPerBase(width);
        lastX = e.clientX;
        pan(-shift);
      });
      browserEl.addEventListener("pointerup", (e) => {
        dragging = false;
        browserEl.releasePointerCapture(e.pointerId);
      });
    }
    const canvas = document.getElementById("cand");
    if (canvas) canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const offset = state.view[0] + (e.clientX - rect.left) / pxPerBase(rect.width);
      const pool = candidatesInView().filter((c) =>
        state.show === "all" || !(c.excluded_by || []).length);
      if (!pool.length) return;
      let best = pool[0];
      for (const c of pool) {
        if (Math.abs(c.offset + 9.5 - offset) < Math.abs(best.offset + 9.5 - offset)) best = c;
      }
      select(best.id);
    });
  }

  function select(id) {
    state.selected = id;
    render();
    const row = document.querySelector(`tr[data-id="${CSS.escape(id)}"]`);
    if (row) row.scrollIntoView({ block: "nearest" });
  }

  function clampView() {
    let [a, b] = state.view;
    const minSpan = 40;
    if (b - a < minSpan) { const m = (a + b) / 2; a = m - minSpan / 2; b = m + minSpan / 2; }
    if (a < 0) { b -= a; a = 0; }
    if (b > promLen) { a -= b - promLen; b = promLen; }
    state.view = [Math.max(0, a), Math.min(promLen, b)];
  }
  function zoom(factor, anchor) {
    const [a, b] = state.view, span = b - a, focus = a + span * anchor;
    const next = span * factor;
    state.view = [focus - next * anchor, focus + next * (1 - anchor)];
    clampView(); redrawTracks();
  }
  function pan(bases) {
    state.view = [state.view[0] + bases, state.view[1] + bases];
    clampView(); redrawTracks();
  }

  let frame = null;
  window.addEventListener("resize", () => {
    if (frame) cancelAnimationFrame(frame);
    frame = requestAnimationFrame(() => { redrawTracks(); drawSparklines(); });
  });
  const scheme = window.matchMedia("(prefers-color-scheme: dark)");
  scheme.addEventListener("change", () => { redrawTracks(); drawSparklines(); });

  document.getElementById("loading").hidden = true;
  app.hidden = false;
  /* Open on the region this run's own position rule covers, which is where a reader looks first.
     With no such rule, the whole promoter stays in view rather than a window from another run. */
  if (ADMITTED) {
    const a = offsetOfTss(ADMITTED[0]), b = offsetOfTss(ADMITTED[1]);
    if (a != null && b != null) {
      const lo = Math.max(0, Math.min(a, b) - 150), hi = Math.min(promLen, Math.max(a, b) + 150);
      if (hi - lo > 40) state.view = [lo, hi];
    }
  }
  const firstPassing = DATA.candidates.find((c) => c.rank === 1);
  if (firstPassing) state.selected = firstPassing.id;
  render();
})();
</script>
