# Cell lines and the evidence that exists for each.
#
# Three axes, because they answer different questions and are rarely all available:
#
#   expression     is the target gene transcribed here at all? The first question, because a
#                  saRNA enhances transcription from a locus that already has some. It does not
#                  switch a silent gene on.
#   chromatin      is the promoter accessible here? Histone marks.
#   tf_occupancy   which factors are actually bound here? ChIP-seq.
#
# `available = false` is a first-class answer and must stay visible: an empty panel means nobody
# looked, not that nothing is there. Add your own lines by pointing SARNA_CELL_LINES at a file or
# a directory of files in this format.

[[cell_line]]
id = "hela"
name = "HeLa"
rrid = "CVCL_0030"
experimental_context = true
proliferating = true
source = "van de Vondervoort 2026"
locator = "chapters 2 and 4, Material and methods - cell culture"
description = """
Cervical adenocarcinoma line, continuously proliferating, with globally open and transcriptionally \
active chromatin. The permissive comparator for RNAa: chapter 4's P21 positive control activates \
reliably here, up to 14-fold on some plates.
"""

[cell_line.expression]
available = false
source = "DepMap / CCLE"
note = """
Not wired in. DepMap publishes RNA-seq for HeLa among about 1,400 cancer lines, so this axis is \
reachable for this line with an adapter and no new experiments.
"""

[cell_line.chromatin]
available = false
source = "ENCODE"
note = """
Not loaded. ENCODE has extensive histone ChIP-seq for HeLa-S3, so this is reachable; the project \
simply holds no HeLa tracks locally, unlike AF22.
"""

[cell_line.tf_occupancy]
available = false
source = "ENCODE"
note = """
Not wired in. HeLa-S3 is one of the most-assayed lines in existence, with hundreds of factors in \
ENCODE, so this is the cell line where occupancy could actually be answered properly.
"""

[[cell_line]]
id = "af22"
name = "AF22 (lt-NES)"
rrid = "CVCL_A5CW"
experimental_context = true
proliferating = false
source = "Falk et al. 2012"
locator = "PLOS ONE 7(1):e29597, capture of neuroepithelial-like stem cells"
description = """
Long-term neuroepithelial-like stem cells derived from human iPSCs. Divide slowly, retain tighter \
epigenetic control over lineage-specific genes, and carry fewer active histone marks at many \
promoters. Chapter 4 found no saRNA activated any locus here, including the P21 control, which is \
the largest single effect in that screen and is a property of the cell rather than of any sequence.
"""

[cell_line.expression]
available = false
note = """
Not available publicly: AF22 is an iPSC-derived research line and is absent from DepMap and GTEx. \
The lab's own RNA-seq, if it exists, is the only route. This is the axis that would most change \
what the tool can say, because it decides whether a target has the baseline transcription a saRNA \
needs in these cells.
"""

[cell_line.chromatin]
available = true
source = "GSE108506"
note = """
Six histone marks loaded from local bigWigs: H3K4me3, H3K27ac, H3K4me1, H3K27me3, H3K9me3 and \
H3K36me3, at 50 bp bins on GRCh37/hg19. Converted per query to GRCh38 (defect B15, ADR 0004). \
Measured consequence: every chapter 4 target promoter is open here, while SCN1A's are closed.
"""

[cell_line.tf_occupancy]
available = false
note = """
No public ChIP-seq exists for this line for any transcription factor, and none is likely to. The \
asymmetry is worth stating: the tool will always know more about HeLa than about the \
disease-relevant model.
"""

# ---------------------------------------------------------------------------------------------
# Lines added because the saRNA literature actually used them, or because they are where a
# missing axis could realistically be answered. Every accession below was read off that line's
# Cellosaurus record rather than recalled; where Cellosaurus corrects the commonly quoted
# description -- Hep-G2 is the clearest case -- the correction is stated here, not the folklore.
#
# None of these ship with loaded data. They are declared so the panel can say what is known
# about a line a researcher names, including that nothing here has been measured in it.

[[cell_line]]
id = "hek293"
name = "HEK293"
rrid = "CVCL_0045"
proliferating = true
source = "Graham et al. 1977"
locator = "J Gen Virol 36:59-74; adenovirus 5-transformed human embryonic kidney"
description = """
Adenovirus 5-transformed human embryonic kidney cells, female, fetal. Transformed rather than \
cancer-derived, transfects at very high efficiency, and is the line most saRNA protocols are \
first established in. Li et al. 2006 included it among the lines where dsP21-322 activated p21, \
so it is a reasonable positive-control context. Note that "HEK293" names a family of drifted and \
engineered derivatives; the accession identifies the parental line only.
"""

[cell_line.expression]
available = false
source = "DepMap / CCLE"
note = """
Not wired in, and not straightforward: HEK293 is not a cancer line, so its coverage in DepMap is \
inconsistent across releases. Human Protein Atlas cell-line RNA-seq is the more dependable route \
for this one.
"""

[cell_line.chromatin]
available = false
source = "ENCODE"
note = "Not loaded. ENCODE holds HEK293 histone ChIP-seq, so this axis is reachable with an adapter."

[cell_line.tf_occupancy]
available = false
source = "ENCODE"
note = """
Not wired in. ENCODE has substantial HEK293 TF ChIP-seq, much of it eGFP-tagged constructs rather \
than antibodies against the native factor, which is a real difference when the question is whether \
a factor occupies a site at endogenous levels.
"""

[[cell_line]]
id = "hepg2"
name = "Hep-G2"
rrid = "CVCL_0027"
proliferating = true
source = "Aden et al. 1979"
locator = "Nature 282:615-616, PMID 233137"
description = """
Male, 15 years. Cellosaurus records this line as a hepatoblastoma; the widely repeated \
"hepatocellular carcinoma" is a misclassification carried forward from the original report. The \
line matters here because MTL-CEBPA, the first saRNA to reach human trials, activates CEBPA in \
liver, and because it is an ENCODE Tier 2 line with deep histone and factor coverage.
"""

[cell_line.expression]
available = false
source = "DepMap / CCLE (ACH-000739)"
note = "Not wired in. DepMap publishes RNA-seq for this line, so the axis is reachable."

[cell_line.chromatin]
available = false
source = "ENCODE"
note = """
Not loaded. One of the most completely profiled lines in ENCODE for histone modifications, so \
this is among the easiest places to add a second chromatin context beside AF22.
"""

[cell_line.tf_occupancy]
available = false
source = "ENCODE"
note = """
Not wired in. ENCODE holds on the order of a hundred factor ChIP-seq datasets here. With K562 it \
is one of the two lines where "is this factor actually bound?" could be answered rather than \
predicted from sequence.
"""

[[cell_line]]
id = "k562"
name = "K-562"
rrid = "CVCL_0004"
proliferating = true
source = "Lozzio & Lozzio 1975"
locator = "Blood 45:321-334, PMID 163658"
description = """
Female, 53 years. Blast-phase chronic myelogenous leukaemia, BCR-ABL1 positive, grown in \
suspension. An ENCODE Tier 1 line and the most densely assayed human cell line in existence. It \
is in this registry for one reason: it is where the transcription-factor occupancy this tool \
cannot measure anywhere else has actually been measured, for hundreds of factors.
"""

[cell_line.expression]
available = false
source = "DepMap / CCLE (ACH-000551)"
note = "Not wired in. DepMap publishes RNA-seq for this line."

[cell_line.chromatin]
available = false
source = "ENCODE"
note = "Not loaded. Tier 1 coverage; every common histone mark is available."

[cell_line.tf_occupancy]
available = false
source = "ENCODE"
note = """
Not wired in, and the single most valuable gap in this registry. The motif panel can only say a \
sequence matches a matrix. Here, and here most of all, ENCODE could say whether the factor is \
bound. That would turn a prediction into an observation for one cell type, and make the \
NOT_ASSAYED status of every other line a measured contrast rather than a blanket.
"""

[[cell_line]]
id = "mcf7"
name = "MCF-7"
rrid = "CVCL_0031"
proliferating = true
source = "Soule et al. 1973"
locator = "J Natl Cancer Inst 51:1409-1416, PMID 4357757"
description = """
Female, 69 years. Invasive breast carcinoma of no special type, from a pleural effusion; \
oestrogen-receptor positive. One of the three lines in which Li et al. 2006 showed dsP21-322 \
activating p21, so it is part of the founding evidence that RNAa is not a quirk of one cell type.
"""

[cell_line.expression]
available = false
source = "DepMap / CCLE (ACH-000019)"
note = "Not wired in. DepMap publishes RNA-seq for this line."

[cell_line.chromatin]
available = false
source = "ENCODE"
note = "Not loaded. ENCODE Tier 2; histone ChIP-seq exists for this line."

[cell_line.tf_occupancy]
available = false
source = "ENCODE"
note = """
Not wired in. Coverage is substantial but skewed towards nuclear-receptor biology, which is what \
this line is usually studied for.
"""

[[cell_line]]
id = "pc3"
name = "PC-3"
rrid = "CVCL_0035"
proliferating = true
source = "Kaighn et al. 1979"
locator = "Invest Urol 17:16-23, PMID 447482"
description = """
Male, 62 years. Prostate carcinoma from a bone metastasis. The cell line RNAa was discovered in: \
Li et al. 2006 activated E-cadherin with dsEcad-215 and dsEcad-302, and p21 with dsP21-322, in \
PC-3. Any sanity check of this tool against the founding experiment happens in this context.
"""

[cell_line.expression]
available = false
source = "DepMap / CCLE (ACH-000090)"
note = "Not wired in. DepMap publishes RNA-seq for this line."

[cell_line.chromatin]
available = false
source = "ENCODE"
note = "Not loaded. ENCODE holds some PC-3 data, considerably less than the Tier 1 and 2 lines."

[cell_line.tf_occupancy]
available = false
note = """
No usable panel. PC-3 is well studied in prostate biology but is not one of the lines with broad \
factor ChIP-seq coverage.
"""

[[cell_line]]
id = "sh-sy5y"
name = "SH-SY5Y"
rrid = "CVCL_0019"
proliferating = true
source = "Biedler et al. 1973"
locator = "Cancer Res 33:2643-2652; thrice-subcloned from SK-N-SH (CVCL_0531)"
description = """
Female, 4 years. Neuroblastoma, a subclone of SK-N-SH, and the neuronal model most laboratories \
reach for. It is here as the accessible comparator to AF22: both are neural, but this one divides \
continuously, is a tumour line, and is present in DepMap, so the expression axis that cannot be \
answered for AF22 can be answered here. Cellosaurus flags it as partially contaminated - some \
redistributed stocks contain mouse-origin cells - which is worth knowing before treating it as a \
clean human neuronal context.
"""

[cell_line.expression]
available = false
source = "DepMap / CCLE (ACH-001188)"
note = """
Not wired in, and the most useful one to add first. AF22 expression is unavailable publicly, so \
this line is the nearest route to asking whether a neural context transcribes a target at all - \
the question that decides whether a saRNA has anything to amplify.
"""

[cell_line.chromatin]
available = false
source = "ENCODE / GEO"
note = """
Not loaded. SH-SY5Y is an ENCODE Tier 3 line with limited coverage; GEO holds more, scattered \
across individual studies with differing protocols, which is a weaker basis than AF22's single \
consistent series.
"""

[cell_line.tf_occupancy]
available = false
note = """
Sparse. GATA3 ChIP-seq exists in ENCODE, and MYCN datasets exist for the inducible SH-SY5Y-MYCN \
derivative rather than the parental line - a derivative is not the same cell, and conflating them \
would attribute to SH-SY5Y a measurement made in something else.
"""
