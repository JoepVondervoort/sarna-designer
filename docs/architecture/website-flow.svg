    <text x="50" y="70" fill="#183932" font-size="24" font-weight="600">Next: richer source evidence and bench-ready delivery</text>
    <text x="50" y="108" fill="#183932" font-size="14" font-weight="400">Planned work · green is done · the engine, workbench and local snapshots remain the foundation</text>
    <rect x="50" y="165" width="320" height="120" rx="10" fill="#fff6e4" stroke="#cba668" stroke-width="1.5" />
    <text x="68" y="200" fill="#183932" font-size="14" font-weight="600">Evidence adapters</text>
    <text x="68" y="220" fill="#617974" font-size="12" font-weight="400">Pinned archived EPDnew → DepMap</text>
    <text x="68" y="240" fill="#617974" font-size="12" font-weight="400">FANTOM5 → ENCODE</text>
    <text x="68" y="260" fill="#617974" font-size="12" font-weight="400">Local data and arbitrary cell tracks</text>
    <rect x="420" y="165" width="320" height="120" rx="10" fill="#fff6e4" stroke="#cba668" stroke-width="1.5" />
    <text x="438" y="200" fill="#183932" font-size="14" font-weight="600">Source provenance</text>
    <text x="438" y="220" fill="#617974" font-size="12" font-weight="400">Dataset versions · sample identity</text>
    <text x="438" y="240" fill="#617974" font-size="12" font-weight="400">Licence / attribution audit</text>
    <text x="438" y="260" fill="#617974" font-size="12" font-weight="400">Availability is not a measurement</text>
    <rect x="790" y="165" width="320" height="120" rx="10" fill="#fff6e4" stroke="#cba668" stroke-width="1.5" />
    <text x="808" y="200" fill="#183932" font-size="14" font-weight="600">Promoter context assessment</text>
    <text x="808" y="220" fill="#617974" font-size="12" font-weight="400">Activity, unknown, or low evidence</text>
    <text x="808" y="240" fill="#617974" font-size="12" font-weight="400">Named sources and editable conventions</text>
    <text x="808" y="260" fill="#617974" font-size="12" font-weight="400">Never a candidate score</text>
    <rect x="50" y="390" width="320" height="120" rx="10" fill="#fff6e4" stroke="#cba668" stroke-width="1.5" />
    <text x="68" y="425" fill="#183932" font-size="14" font-weight="600">Bench exports</text>
    <text x="68" y="445" fill="#617974" font-size="12" font-weight="400">19 nt cores + dTdT chemistry</text>
    <text x="68" y="465" fill="#617974" font-size="12" font-weight="400">Order CSV + sanity report</text>
    <text x="68" y="485" fill="#617974" font-size="12" font-weight="400">Promoter off-target findings reported</text>
    <rect x="420" y="390" width="320" height="120" rx="10" fill="#fff6e4" stroke="#cba668" stroke-width="1.5" />
    <text x="438" y="425" fill="#183932" font-size="14" font-weight="600">Per-run methods document</text>
    <text x="438" y="445" fill="#617974" font-size="12" font-weight="400">Partly done: the Excel workbook carries</text>
    <text x="438" y="465" fill="#617974" font-size="12" font-weight="400">the run, its rules and their sources</text>
    <text x="438" y="485" fill="#617974" font-size="12" font-weight="400">Still to write: a citable prose record</text>
    <rect x="790" y="390" width="320" height="120" rx="10" fill="#fff6e4" stroke="#cba668" stroke-width="1.5" />
    <text x="808" y="425" fill="#183932" font-size="14" font-weight="600">Researcher installation</text>
    <text x="808" y="445" fill="#617974" font-size="12" font-weight="400">Documented and verified on Linux</text>
    <text x="808" y="465" fill="#617974" font-size="12" font-weight="400">Wheel route needs no Git or repo access</text>
    <text x="808" y="485" fill="#617974" font-size="12" font-weight="400">Windows / macOS still unverified by a person</text>
    <rect x="420" y="635" width="320" height="120" rx="10" fill="#fff6e4" stroke="#cba668" stroke-width="1.5" />
    <text x="438" y="670" fill="#183932" font-size="14" font-weight="600">Validation and release</text>
    <text x="438" y="690" fill="#617974" font-size="12" font-weight="400">Independent checks of scientific claims</text>
    <text x="438" y="710" fill="#617974" font-size="12" font-weight="400">Browser and reproducibility checks</text>
    <text x="438" y="730" fill="#617974" font-size="12" font-weight="400">New empirical data, without overclaiming</text>
  </g>
